# Labels on org runners enabled for this repo (public-ci + gpu-runners).
self-hosted-runner:
  labels:
    - nvidia
    - sm_70
    - sm_75
    - sm_86
    - sm_120
    - v100s
    - rtx_3070
    - gtx_1660s
    - rtx_5060ti_8gb
    - fast
    - gfx1012
    - amd-gpu
# Every repository variable a workflow may read; actionlint rejects others
# (catches typos such as vars.SKIP_SM12O). SKIP_* come from .github/hardware.json.
config-variables:
  - PYPI_MAX_FILE_MB
  - RELEASE_INCLUDE_WINDOWS
  - WINDOWS_CI_STRICT
  - SKIP_SM70
  - SKIP_SM75
  - SKIP_SM86
  - SKIP_SM120
  - SKIP_GFX1012
  - SKIP_METAL_ARM
  - SKIP_METAL_INTEL
  - ROADMAP_HEALTH_ISSUE
