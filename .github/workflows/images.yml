# Slim runtime images → GHCR. Public repo.
#
# Publish: self-hosted fuzzybits-ci (packages:write via GITHUB_TOKEN, isolated
# DOCKER_CONFIG). Smoke: self-hosted NVIDIA GPUs, plus the optional AMD gfx1012
# (gpu-runners / amd-gpu); trusted triggers only. Runtime and toolchain images
# are public — smoke pulls anonymously and must not log in or hold
# packages:read.
# Never pull_request / pull_request_target / workflow_run — self-hosted jobs
# must not be reachable from PR code (#34).
name: Runtime images

on:
  schedule:
    # Offset from gpu.yml (17 6) so nightly smoke does not queue behind GPU tests.
    - cron: "47 7 * * *"
  workflow_dispatch:
  push:
    branches: [develop, "ci/**"]
    tags: ["v*"]

# ci/** branches keep one pending run per branch (a newer push replaces a
# waiting run; running jobs are never cancelled). develop, tags and the
# schedule get a unique group per run, so no commit's coverage is dropped.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/fuzzybit-org/fuzzybits-runtime
  TOOLCHAIN_REPO: ghcr.io/fuzzybit-org/fuzzybits-toolchain

jobs:
  gate:
    name: gate
    runs-on: { group: fuzzybits-ci, labels: [self-hosted, Linux, X64] }
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.toolchain.outputs.proceed }}
      toolchain_image: ${{ steps.toolchain.outputs.image }}
    steps:
      - name: Isolate Docker credentials (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "${RUNNER_TEMP}/docker-config"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-config" >> "${GITHUB_ENV}"

      - name: Reclaim workspace (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          # Containers still mounting this workspace are left over from an earlier job.
          docker ps -aq --filter "volume=${GITHUB_WORKSPACE}" | xargs -r docker rm -f
          docker run --rm -v "${GITHUB_WORKSPACE}:/w" -v "${RUNNER_TOOL_CACHE}:/t" alpine:3.20 chown -R "$(id -u):$(id -g)" /w /t

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Changed files
        id: changes
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BEFORE}" && ! "${BEFORE}" =~ ^0+$ ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}")"
          elif base="$(git merge-base origin/develop HEAD 2>/dev/null)" && [[ "${base}" != "$(git rev-parse HEAD)" ]]; then
            files="$(git diff --name-only "${base}" HEAD)"
          else
            files="$(git diff --name-only HEAD^ HEAD || true)"
          fi
          echo "changed files:"
          printf '%s\n' "${files}"
          engine=false
          if grep -Eq '^(src/|python/|targets/|cmake/|share/|CMakeLists\.txt|CMakePresets\.json|toolchain\.env|pyproject\.toml|docker/|scripts/ci/toolchain-sha\.sh|\.dockerignore|\.github/workflows/images\.yml)' <<<"${files}"; then
            engine=true
          fi
          toolchain=false
          if grep -Eq '^(toolchain\.env|docker/toolchain\.Dockerfile|scripts/ci/toolchain-sha\.sh|\.github/workflows/toolchain\.yml)$' <<<"${files}"; then
            toolchain=true
          fi
          echo "engine=${engine}" >> "${GITHUB_OUTPUT}"
          echo "toolchain=${toolchain}" >> "${GITHUB_OUTPUT}"

      # The toolchain package is public; inspect anonymously. A missing
      # immutable tag is never papered over with the moving tag: that image
      # predates this commit's toolchain.env (e.g. it has no HIP backend).
      - name: Resolve toolchain image
        id: toolchain
        env:
          EVENT: ${{ github.event_name }}
          ENGINE_CHANGED: ${{ steps.changes.outputs.engine }}
          TOOLCHAIN_CHANGED: ${{ steps.changes.outputs.toolchain }}
        run: |
          set -euo pipefail
          if [[ "${EVENT}" == push && "${GITHUB_REF}" == refs/heads/develop && "${ENGINE_CHANGED}" != true ]]; then
            echo "no engine/image change on develop; skipping publish"
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          acpp_ref="$(sed -n 's/^ACPP_REF=//p' toolchain.env)"
          sha="$(scripts/ci/toolchain-sha.sh)"
          image="${TOOLCHAIN_REPO}:${acpp_ref}-generic-${sha}"
          if docker manifest inspect "${image}" >/dev/null 2>&1; then
            echo "using ${image}"
            echo "image=${image}" >> "${GITHUB_OUTPUT}"
            echo "proceed=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${EVENT}" == push && "${TOOLCHAIN_CHANGED}" == true ]]; then
            echo "::notice title=Runtime images deferred::${image} is built by this push's toolchain.yml run, which dispatches this workflow on ${GITHUB_REF_NAME} when it finishes."
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::error title=Toolchain image missing::${image} is not published. Run toolchain.yml on ${GITHUB_REF_NAME}."
            exit 1
          fi

  publish:
    name: publish-${{ matrix.variant }}
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: { group: fuzzybits-ci, labels: [self-hosted, Linux, X64] }
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: generic
            cmake_preset: generic
            fuzzybits_variant: generic
            acpp_targets: generic
            cuda_embed_ptx: n/a
            include_sscp: "1"
          - variant: cuda12.8-sm70
            cmake_preset: cuda-sm70
            fuzzybits_variant: cuda-sm70
            acpp_targets: "cuda:sm_70"
            cuda_embed_ptx: highest
            include_sscp: "0"
          - variant: cuda12.8-sm86
            cmake_preset: cuda-sm86
            fuzzybits_variant: cuda-sm86
            acpp_targets: "cuda:sm_86"
            cuda_embed_ptx: highest
            include_sscp: "0"
          - variant: cuda12.8-sm120
            cmake_preset: cuda-sm120
            fuzzybits_variant: cuda-sm120
            acpp_targets: "cuda:sm_120"
            cuda_embed_ptx: highest
            include_sscp: "0"
    env:
      VARIANT: ${{ matrix.variant }}
      TOOLCHAIN_IMAGE: ${{ needs.gate.outputs.toolchain_image }}
    steps:
      - name: Isolate Docker credentials (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "${RUNNER_TEMP}/docker-config"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-config" >> "${GITHUB_ENV}"

      - name: Reclaim workspace (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          # Containers still mounting this workspace are left over from an earlier job.
          docker ps -aq --filter "volume=${GITHUB_WORKSPACE}" | xargs -r docker rm -f
          docker run --rm -v "${GITHUB_WORKSPACE}:/w" -v "${RUNNER_TOOL_CACHE}:/t" alpine:3.20 chown -R "$(id -u):$(id -g)" /w /t

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # ubuntu-24.04 starts with ~20–30 GB free. The toolchain image is ~12.5 GB
      # uncompressed plus two C++ compiles; drop unused hosted-image trees.
      - name: Free disk
        if: runner.environment == 'github-hosted'
        run: |
          set -eux
          echo "== disk before =="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/node \
            /usr/lib/jvm \
            /usr/local/.ghcup \
            /opt/microsoft \
            /usr/share/miniconda || true
          sudo docker system prune -af || true
          echo "== disk after =="
          df -h /

      - name: Load pins from toolchain.env
        run: |
          set -eu
          set -a
          # shellcheck disable=SC1091
          . ./toolchain.env
          set +a
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          {
            echo "ACPP_REF=${ACPP_REF}"
            echo "ACPP_REPO=${ACPP_REPO}"
            echo "ACPP_COMMIT=${ACPP_COMMIT}"
            echo "CLANG_VERSION=${CLANG_VERSION}"
            echo "CUDA_VERSION=${CUDA_VERSION}"
            echo "ROCM_VERSION=${ROCM_VERSION}"
            echo "FUZZYBITS_VERSION=${version}"
            echo "SHA12=${GITHUB_SHA:0:12}"
          } >> "${GITHUB_ENV}"

      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          IMAGE="${IMAGE}"
          VARIANT="${VARIANT}"
          SHA12="${SHA12}"
          tags=()
          if [[ "${GITHUB_REF}" == refs/heads/ci/* ]]; then
            primary="ci-${SHA12}-${VARIANT}"
            tags+=("${IMAGE}:${primary}")
          elif [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            version="${GITHUB_REF_NAME}"
            primary="${version}-${VARIANT}"
            tags+=("${IMAGE}:${primary}")
            if [[ "${VARIANT}" == generic ]]; then
              tags+=("${IMAGE}:${version}")
              tags+=("${IMAGE}:latest")
            fi
          else
            # develop, schedule, workflow_dispatch on develop (or other trusted refs)
            primary="sha-${SHA12}-${VARIANT}"
            tags+=("${IMAGE}:nightly-${VARIANT}")
            tags+=("${IMAGE}:${primary}")
          fi
          {
            echo "primary=${primary}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "primary tag: ${primary}"
          printf 'tags:\n'
          printf '  %s\n' "${tags[@]}"

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/runtime.Dockerfile
          target: runtime
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            TOOLCHAIN_IMAGE=${{ env.TOOLCHAIN_IMAGE }}
            CMAKE_PRESET=${{ matrix.cmake_preset }}
            FUZZYBITS_VARIANT=${{ matrix.fuzzybits_variant }}
            INCLUDE_SSCP_JIT=${{ matrix.include_sscp }}
            ACPP_TARGETS=${{ matrix.acpp_targets }}
            CUDA_EMBED_PTX=${{ matrix.cuda_embed_ptx }}
            CLANG_VERSION=${{ env.CLANG_VERSION }}
            ACPP_REF=${{ env.ACPP_REF }}
            ACPP_COMMIT=${{ env.ACPP_COMMIT }}
            CUDA_VERSION=${{ env.CUDA_VERSION }}
            ROCM_VERSION=${{ matrix.include_sscp == '1' && env.ROCM_VERSION || 'n/a' }}
            FUZZYBITS_REVISION=${{ github.sha }}
            FUZZYBITS_VERSION=${{ env.FUZZYBITS_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/fuzzybit-org/fuzzybits
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.FUZZYBITS_VERSION }}
            org.opencontainers.image.title=fuzzybits-runtime
            dev.fuzzybits.acpp.ref=${{ env.ACPP_REF }}
            dev.fuzzybits.acpp.commit=${{ env.ACPP_COMMIT }}
            dev.fuzzybits.acpp.targets=${{ matrix.acpp_targets }}
            dev.fuzzybits.cuda.embed_ptx=${{ matrix.cuda_embed_ptx }}
            dev.fuzzybits.cuda.version=${{ env.CUDA_VERSION }}
            dev.fuzzybits.rocm.version=${{ matrix.include_sscp == '1' && env.ROCM_VERSION || 'n/a' }}
            dev.fuzzybits.variant=${{ matrix.variant }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }},mode=max

      - name: Inspect published image
        run: |
          set -euo pipefail
          tag="${IMAGE}:${{ steps.meta.outputs.primary }}"
          echo "## ${{ matrix.variant }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- primary: \`${tag}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- toolchain: \`${TOOLCHAIN_IMAGE}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- digest: \`${{ steps.build.outputs.digest }}\`" >> "${GITHUB_STEP_SUMMARY}"
          docker buildx imagetools inspect "${tag}" | tee /tmp/inspect.txt
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          head -n 40 /tmp/inspect.txt >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

      - name: Set GHCR package public
        if: matrix.variant == 'generic'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            /orgs/fuzzybit-org/packages/container/fuzzybits-runtime/visibility \
            -f visibility=public

  smoke:
    name: smoke-${{ matrix.name }}
    needs: publish
    if: needs.publish.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          # xerxes Docker: physical GPU 0 = Tesla V100S (shared by sm_70 runners).
          # Both variants in one job: two matrix rows with the same
          # concurrency group cancel each other as "higher priority waiting
          # request" before either starts.
          - name: sm70
            variants: "generic cuda12.8-sm70"
            runs_on: [self-hosted, Linux, X64, nvidia, sm_70, v100s]
            concurrency_group: gpu-xerxes-v100s
            docker_gpus: device=0
          # physical GPU 1 = RTX 3070
          - name: sm86
            variants: "generic cuda12.8-sm86"
            runs_on: [self-hosted, Linux, X64, nvidia, sm_86, rtx_3070]
            concurrency_group: gpu-xerxes-3070
            docker_gpus: device=1
          - name: sm120
            variants: "generic cuda12.8-sm120"
            runs_on: [self-hosted, Linux, X64, nvidia, fast, sm_120, rtx_5060ti_8gb]
            concurrency_group: gpu-shelly-5060ti
            docker_gpus: device=0
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    concurrency:
      group: ${{ matrix.concurrency_group }}
      cancel-in-progress: false
    env:
      DOCKER_GPUS: ${{ matrix.docker_gpus }}
      VARIANTS: ${{ matrix.variants }}
      SMOKE_PREFIX: fuzzybits-runtime-smoke-${{ github.run_id }}-${{ matrix.name }}-${{ github.run_attempt }}
    steps:
      - name: Resolve image tags
        run: |
          set -euo pipefail
          SHA12="${GITHUB_SHA:0:12}"
          images=()
          for VARIANT in ${VARIANTS}; do
            if [[ "${GITHUB_REF}" == refs/heads/ci/* ]]; then
              TAG="ci-${SHA12}-${VARIANT}"
            elif [[ "${GITHUB_REF_TYPE}" == tag ]]; then
              TAG="${GITHUB_REF_NAME}-${VARIANT}"
            else
              TAG="sha-${SHA12}-${VARIANT}"
            fi
            images+=("${IMAGE}:${TAG}")
            echo "RUNTIME_IMAGE_${VARIANT}=${IMAGE}:${TAG}"
          done
          echo "RUNTIME_IMAGES=${images[*]}" >> "${GITHUB_ENV}"

      - name: GPU mapping probe
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-} docker_gpus=${DOCKER_GPUS}"
          echo "CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES-UNSET}"
          echo "NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES-UNSET}"
          nvidia-smi -L || true
          docker run --rm --gpus "${DOCKER_GPUS}" --entrypoint bash \
            nvidia/cuda:12.8.1-base-ubuntu24.04 -lc 'nvidia-smi -L'

      - name: Pull runtime images
        run: |
          set -euo pipefail
          for RUNTIME_IMAGE in ${RUNTIME_IMAGES}; do
            docker pull "${RUNTIME_IMAGE}"
            docker image inspect "${RUNTIME_IMAGE}" --format '{{.Id}} {{.Size}}' \
              | awk '{printf "id=%s uncompressed_bytes=%s uncompressed_GiB=%.2f\n", $1, $2, $2/1024/1024/1024}'
          done

      - name: Image smoke (mcscram-smoke + fzb compile/run)
        run: |
          set -euo pipefail
          for RUNTIME_IMAGE in ${RUNTIME_IMAGES}; do
            tag="${RUNTIME_IMAGE##*:}"
            name="${SMOKE_PREFIX}-${tag}"
            echo "::group::smoke ${RUNTIME_IMAGE}"
            omp=1
            # SMCP-only images (cuda12.8-smNN) have no host kernels.
            if [[ "${RUNTIME_IMAGE}" == *-cuda12.8-sm* ]]; then
              omp=0
            fi
            docker run --rm --name "${name}" --gpus "${DOCKER_GPUS}" \
              --entrypoint fuzzybits-image-smoke \
              -e SMOKE_FZB_OMP="${omp}" \
              -e FZB_OMP_TRIALS=1e6 \
              "${RUNTIME_IMAGE}"
            echo "::endgroup::"
          done

      - name: Drop this job's containers
        if: always()
        run: |
          for RUNTIME_IMAGE in ${RUNTIME_IMAGES}; do
            docker rm -f "${SMOKE_PREFIX}-${RUNTIME_IMAGE##*:}" || true
          done

      - name: Remove pulled runtime images
        if: always()
        run: |
          for RUNTIME_IMAGE in ${RUNTIME_IMAGES}; do
            docker rmi "${RUNTIME_IMAGE}" || true
          done


  smoke-cpu:
    name: smoke-cpu-omp
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: { group: fuzzybits-ci, labels: [self-hosted, Linux, X64] }
    timeout-minutes: 20
    env:
      VARIANT: generic
    steps:
      - name: Isolate Docker credentials (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "${RUNNER_TEMP}/docker-config"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-config" >> "${GITHUB_ENV}"

      - name: Reclaim workspace (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          # Containers still mounting this workspace are left over from an earlier job.
          docker ps -aq --filter "volume=${GITHUB_WORKSPACE}" | xargs -r docker rm -f
          docker run --rm -v "${GITHUB_WORKSPACE}:/w" -v "${RUNNER_TOOL_CACHE}:/t" alpine:3.20 chown -R "$(id -u):$(id -g)" /w /t

      - name: Resolve image tag
        run: |
          set -euo pipefail
          SHA12="${GITHUB_SHA:0:12}"
          if [[ "${GITHUB_REF}" == refs/heads/ci/* ]]; then
            TAG="ci-${SHA12}-${VARIANT}"
          elif [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            TAG="${GITHUB_REF_NAME}-${VARIANT}"
          else
            TAG="sha-${SHA12}-${VARIANT}"
          fi
          echo "RUNTIME_IMAGE=${IMAGE}:${TAG}" >> "${GITHUB_ENV}"
          echo "RUNTIME_IMAGE=${IMAGE}:${TAG}"

      - name: Pull runtime image
        run: |
          set -euo pipefail
          docker pull "${RUNTIME_IMAGE}"

      - name: Hosted CPU omp smoke (fzb compile/run chinese)
        run: |
          set -euo pipefail
          docker run --rm --entrypoint fuzzybits-image-smoke \
            -e ACPP_VISIBILITY_MASK=omp \
            -e SMOKE_MC=0 \
            -e SMOKE_FZB_CUDA=0 \
            -e SMOKE_FZB_OMP=1 \
            -e FZB_OMP_TRIALS=1e6 \
            "${RUNTIME_IMAGE}"

  # Optional: AMD Radeon Pro 5500M 8 GB (Navi 14, gfx1012, RDNA1, 24 CUs) on
  # bubs (mbp-1) via the HIP backend + SSCP JIT in the generic image.
  # continue-on-error keeps a failure (or the single amd-gpu runner being
  # offline/busy past the timeout) from failing the workflow. The image's
  # default mask (cuda;hip) is kept on purpose: that is what users get. No
  # concurrency group: mbp-1 is the only amd-gpu runner, and a group would let
  # GitHub cancel a pending run when a newer one queues. Set repository
  # variable FUZZYBITS_AMD_GPU=disabled while mbp-1 is down (a queued job waits
  # up to 24 h for it).
  smoke-amd:
    name: smoke-amd-gfx1012 (optional)
    needs: publish
    if: needs.publish.result == 'success' && vars.FUZZYBITS_AMD_GPU != 'disabled'
    continue-on-error: true
    runs-on: { group: gpu-runners, labels: [self-hosted, Linux, X64, amd-gpu] }
    timeout-minutes: 30
    env:
      VARIANT: generic
      SMOKE_NAME: fuzzybits-runtime-smoke-${{ github.run_id }}-amd-${{ github.run_attempt }}
    steps:
      - name: Isolate Docker credentials (self-hosted)
        run: |
          mkdir -p "${RUNNER_TEMP}/docker-config"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-config" >> "${GITHUB_ENV}"

      - name: Reclaim workspace (self-hosted)
        run: |
          docker ps -aq --filter "volume=${GITHUB_WORKSPACE}" | xargs -r docker rm -f
          docker run --rm -v "${GITHUB_WORKSPACE}:/w" -v "${RUNNER_TOOL_CACHE}:/t" alpine:3.20 chown -R "$(id -u):$(id -g)" /w /t

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve image tag
        run: |
          set -euo pipefail
          SHA12="${GITHUB_SHA:0:12}"
          if [[ "${GITHUB_REF}" == refs/heads/ci/* ]]; then
            TAG="ci-${SHA12}-${VARIANT}"
          elif [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            TAG="${GITHUB_REF_NAME}-${VARIANT}"
          else
            TAG="sha-${SHA12}-${VARIANT}"
          fi
          echo "RUNTIME_IMAGE=${IMAGE}:${TAG}" >> "${GITHUB_ENV}"
          echo "RUNTIME_IMAGE=${IMAGE}:${TAG}"

      - name: AMD GPU probe
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-} kernel=$(uname -r)"
          cat /sys/module/amdgpu/version 2>/dev/null || true
          mapfile -t amd_args < <(scripts/ci/amd-docker-args.sh)
          echo "AMD_DOCKER_ARGS=${amd_args[*]}" >> "${GITHUB_ENV}"
          echo "docker args: ${amd_args[*]}"

      - name: Pull runtime image
        run: |
          set -euo pipefail
          docker pull "${RUNTIME_IMAGE}"
          docker image inspect "${RUNTIME_IMAGE}" --format '{{.Id}} {{.Size}}' \
            | awk '{printf "id=%s uncompressed_GiB=%.2f\n", $1, $2/1024/1024/1024}'

      # Same 1e8 trials as the CUDA smoke (σ̂ ≈ 3.4e-6 at p ≈ 1.17e-3). Measured
      # on the 5500M: 1e9 trials in 2.2 s warm; the cold SSCP JIT is seconds.
      - name: Image smoke (fzb + Python on HIP)
        run: |
          set -euo pipefail
          read -r -a amd_args <<<"${AMD_DOCKER_ARGS}"
          docker run --rm --name "${SMOKE_NAME}" "${amd_args[@]}" \
            --entrypoint fuzzybits-image-smoke \
            -e SMOKE_TIMEOUT=120 \
            -e SMOKE_MC=0 \
            -e SMOKE_FZB_CUDA=0 \
            -e SMOKE_FZB_OMP=0 \
            -e SMOKE_FZB_HIP=1 \
            -e FZB_HIP_TRIALS=1e8 \
            "${RUNTIME_IMAGE}"

      - name: Drop this job's container
        if: always()
        run: docker rm -f "${SMOKE_NAME}" || true

      - name: Remove pulled runtime image
        if: always()
        run: docker rmi "${RUNTIME_IMAGE}" || true
