# GitHub-hosted Windows x86_64 (windows-2025). Public repo: Windows minutes
# are free. Never self-hosted. AdaptiveCpp generic SSCP + CUDA on Windows
# requires linking AdaptiveCpp into LLVM (see AdaptiveCpp install docs);
# the install is cached on (ACPP_REF_WINDOWS, LLVM_REF_WINDOWS, CUDA, ImageOS).
#
# Jobs mirror Linux and macOS: windows-omp builds and runs ctest on the OpenMP
# CPU backend (the runners have no GPU); windows-wheel builds, repairs and
# smoke-tests a wheel for every CPython in scripts/ci/python-versions. Future
# backends get their own job names (windows-cuda, windows-opencl, ...).
#
# Windows is not yet a supported platform, so both jobs are allowed to fail:
# a failure shows on the run and the PR, but does not fail the workflow. Set
# the repository variable WINDOWS_CI_STRICT=true to make failures count, and
# release.yml always calls this workflow with strict: true. Neither job is a
# required check on develop.
name: Windows

on:
  pull_request:
  push:
    branches: [develop, "ci/**"]
  workflow_dispatch:
    inputs:
      wheel_only:
        description: Skip windows-omp and build only the wheels.
        type: boolean
        default: false
      strict:
        description: Fail the workflow when a Windows job fails.
        type: boolean
        default: false
      python_versions:
        description: Space-separated CPython versions (empty = scripts/ci/python-versions).
        type: string
        default: ""
  # release.yml builds the Windows wheels through this workflow.
  workflow_call:
    inputs:
      version_override:
        description: Rewrite package versions before building (TestPyPI rehearsals).
        type: string
        default: ""
      wheel_only:
        description: Skip windows-omp and build only the wheels.
        type: boolean
        default: false
      strict:
        description: Fail the workflow when a Windows job fails.
        type: boolean
        default: false
      python_versions:
        description: Space-separated CPython versions (empty = scripts/ci/python-versions).
        type: string
        default: ""

concurrency:
  group: windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-omp:
    name: windows-omp
    if: ${{ !inputs.wheel_only }}
    runs-on: windows-2025
    timeout-minutes: 120
    # Allowed to fail unless WINDOWS_CI_STRICT=true or the caller passes strict.
    continue-on-error: ${{ !inputs.strict && vars.WINDOWS_CI_STRICT != 'true' }}
    env:
      ACPP_PREFIX: ${{ github.workspace }}/.cache/acpp-prefix
      SCCACHE_GHA_ENABLED: "true"
      # windows-generic plus CodeView debug info, so crash stacks have symbols.
      FZB_PRESET: windows-generic-debuginfo
    steps:
      # The runner sets core.autocrlf=true. Benchmark manifests and test fixtures hash the
      # committed LF bytes, including those in submodules, so check out without conversion.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Windows toolchain
        id: toolchain
        uses: ./.github/actions/windows-toolchain
        with:
          cache-name: windows-omp

      - name: Configure and build fuzzybits (windows-generic-debuginfo preset)
        id: product
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $start = Get-Date
          $clang = Join-Path $env:ACPP_PREFIX 'bin\clang.exe'
          $env:PATH = "$env:ACPP_PREFIX\bin;$env:PATH"
          $env:CC = $clang
          $env:CXX = $clang
          $env:CFLAGS = '-D_ALLOW_COMPILER_VERSION_MISMATCH -DNOMINMAX'
          $env:CXXFLAGS = $env:CFLAGS
          $env:AdaptiveCpp_DIR = Join-Path $env:ACPP_PREFIX 'lib\cmake\AdaptiveCpp'
          cmake --preset $env:FZB_PRESET `
            -DCMAKE_PREFIX_PATH="$env:ACPP_PREFIX" `
            -DAdaptiveCpp_DIR="$env:AdaptiveCpp_DIR" `
            -DCMAKE_C_COMPILER="$clang" `
            -DCMAKE_CXX_COMPILER="$clang" `
            -DBUILD_TESTING=ON `
            -DBUILD_PYTHON_BINDINGS=ON `
            -DMALLOC_TYPE=malloc
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed ($LASTEXITCODE)" }
          cmake --build --preset $env:FZB_PRESET
          if ($LASTEXITCODE -ne 0) { throw "cmake --build failed ($LASTEXITCODE)" }
          $secs = [int]((Get-Date) - $start).TotalSeconds
          "fuzzybits_build_seconds=$secs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: fzb --help
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:GITHUB_WORKSPACE "build\$env:FZB_PRESET"
          $libxml = Join-Path $build '_deps\libxml2-build'
          $env:PATH = "$env:ACPP_PREFIX\bin;$libxml;$build\src;$env:PATH"
          $bin = Get-ChildItem -Path $build -Recurse -Filter fzb.exe |
            Select-Object -First 1
          if (-not $bin) { throw "fzb.exe not found" }
          Write-Host "fzb: $($bin.FullName)"
          if (Get-Command dumpbin -ErrorAction SilentlyContinue) {
            dumpbin /DEPENDENTS $bin.FullName
          }
          & $bin.FullName --help
          if ($LASTEXITCODE -ne 0) { throw "fzb --help exited $LASTEXITCODE" }

      - name: Enable crash dumps
        shell: pwsh
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP 'crash-dumps'
          "FZB_CRASH_DUMPS=$dumps" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          pwsh -NoProfile -File scripts/ci/windows-crash-dumps.ps1 enable -DumpDir $dumps

      - name: ctest CPU (OpenMP, quarantine excluded)
        timeout-minutes: 20
        env:
          ACPP_VISIBILITY_MASK: omp
          ACPP_DEBUG_LEVEL: "0"
          ACPP_PERSISTENT_RUNTIME: "1"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:GITHUB_WORKSPACE "build\$env:FZB_PRESET"
          $libxml = Join-Path $build '_deps\libxml2-build'
          $env:PATH = "$env:ACPP_PREFIX\bin;$libxml;$build\src;$env:PATH"
          $start = Get-Date
          ctest --preset $env:FZB_PRESET --output-on-failure --no-tests=error
          $code = $LASTEXITCODE
          $secs = [int]((Get-Date) - $start).TotalSeconds
          "cpu_ctest_seconds=$secs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($code -ne 0) {
            @(
              '## ctest (windows-omp)',
              "ctest exited $code after ${secs}s. Failures are reported, not hidden; the job is allowed to fail unless WINDOWS_CI_STRICT is true (#76).",
              'Known remaining (#108): scram_legacy BSCU mean/sigma; scram-cli ACCESS_VIOLATION (0xC0000005) in mc.cli.* and mc.fzb_cli_identity.*. Stacks: the Crash diagnostics step.'
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            throw "ctest failed ($code)"
          }

      # Diagnostics only: prints stacks and exits 0, so the failed step above stays the result.
      - name: Crash diagnostics
        id: dumps
        if: failure() && env.FZB_CRASH_DUMPS != ''
        timeout-minutes: 30
        env:
          ACPP_VISIBILITY_MASK: omp
          FUZZYBITS_BACKEND: omp
          ACPP_DEBUG_LEVEL: "0"
          ACPP_PERSISTENT_RUNTIME: "1"
        shell: pwsh
        run: |
          $build = Join-Path $env:GITHUB_WORKSPACE "build\$env:FZB_PRESET"
          $libxml = Join-Path $build '_deps\libxml2-build'
          $env:PATH = "$env:ACPP_PREFIX\bin;$libxml;$build\src;$env:PATH"
          pwsh -NoProfile -File scripts/ci/windows-crash-dumps.ps1 diagnose `
            -DumpDir $env:FZB_CRASH_DUMPS -SearchRoot $build, $env:ACPP_PREFIX -BuildDir $build

      - name: Upload crash dumps and symbols
        if: failure() && steps.dumps.outputs.count != '' && steps.dumps.outputs.count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-omp-crash-dumps
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ env.FZB_CRASH_DUMPS }}
            build/${{ env.FZB_PRESET }}/**/*.pdb
            build/${{ env.FZB_PRESET }}/**/*.exe
            build/${{ env.FZB_PRESET }}/**/*.dll

      - name: Record timings
        if: always()
        shell: pwsh
        run: |
          @(
            '## windows-omp timings',
            "- AdaptiveCpp cache: ${{ steps.toolchain.outputs.acpp-cache || 'n/a' }}",
            "- AdaptiveCpp+LLVM build seconds: $($env:acpp_build_seconds)",
            "- fuzzybits build seconds: $($env:fuzzybits_build_seconds)",
            "- CPU ctest seconds: $($env:cpu_ctest_seconds)",
            "- ACPP_REF_WINDOWS: $env:ACPP_REF_WINDOWS",
            "- LLVM_REF_WINDOWS: $env:LLVM_REF_WINDOWS",
            "- CUDA_VERSION: $env:CUDA_VERSION"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (Get-Command sccache -ErrorAction SilentlyContinue) { sccache --show-stats }
          Get-PSDrive -PSProvider FileSystem

  windows-wheel:
    name: windows-wheel
    runs-on: windows-2025
    timeout-minutes: 180
    # Allowed to fail unless WINDOWS_CI_STRICT=true or the caller passes strict.
    continue-on-error: ${{ !inputs.strict && vars.WINDOWS_CI_STRICT != 'true' }}
    env:
      ACPP_PREFIX: ${{ github.workspace }}/.cache/acpp-prefix
      SCCACHE_GHA_ENABLED: "true"
      PYTHON_VERSIONS: ${{ inputs.python_versions }}
    steps:
      # The runner sets core.autocrlf=true. Benchmark manifests and test fixtures hash the
      # committed LF bytes, including those in submodules, so check out without conversion.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Apply version override
        if: ${{ inputs.version_override }}
        shell: bash
        env:
          VERSION: ${{ inputs.version_override }}
        run: bash scripts/ci/release-version.sh apply "${VERSION}"

      - name: Windows toolchain
        id: toolchain
        uses: ./.github/actions/windows-toolchain
        with:
          cache-name: windows-wheel

      - name: uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0

      # Every version is attempted; the step fails if any failed, and the
      # uploads below still publish the wheels that did build.
      - name: Build wheels
        id: wheel
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/windows-wheel-versions.ps1 build

      - name: Upload cp312 wheel
        if: always() && steps.wheel.outcome != 'skipped' && hashFiles('dist/fuzzybits-*-cp312-*.whl') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzybits-cp312-win_amd64
          path: dist/fuzzybits-*-cp312-*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload cp313 wheel
        if: always() && steps.wheel.outcome != 'skipped' && hashFiles('dist/fuzzybits-*-cp313-*.whl') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzybits-cp313-win_amd64
          path: dist/fuzzybits-*-cp313-*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload cp314 wheel
        if: always() && steps.wheel.outcome != 'skipped' && hashFiles('dist/fuzzybits-*-cp314-*.whl') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzybits-cp314-win_amd64
          path: dist/fuzzybits-*-cp314-*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload cp315 wheel
        if: always() && steps.wheel.outcome != 'skipped' && hashFiles('dist/fuzzybits-*-cp315-*.whl') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzybits-cp315-win_amd64
          path: dist/fuzzybits-*-cp315-*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Enable crash dumps
        if: always() && steps.wheel.outcome != 'skipped' && hashFiles('dist/fuzzybits-*.whl') != ''
        shell: pwsh
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP 'crash-dumps'
          "FZB_CRASH_DUMPS=$dumps" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          pwsh -NoProfile -File scripts/ci/windows-crash-dumps.ps1 enable -DumpDir $dumps

      - name: Smoke tests (clean venv per version)
        if: always() && steps.wheel.outcome != 'skipped' && hashFiles('dist/fuzzybits-*.whl') != ''
        timeout-minutes: 60
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/windows-wheel-versions.ps1 smoke

      # Diagnostics only: prints stacks and exits 0. The wheels carry no PDBs, so frames in
      # fuzzybits modules show as export+offset; windows-omp has the symbolised build.
      - name: Crash diagnostics
        id: dumps
        if: failure() && env.FZB_CRASH_DUMPS != ''
        timeout-minutes: 20
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/ci/windows-crash-dumps.ps1 diagnose `
            -DumpDir $env:FZB_CRASH_DUMPS -SearchRoot $env:RUNNER_TEMP, (Join-Path $env:APPDATA 'uv\python')

      - name: Upload crash dumps
        if: failure() && steps.dumps.outputs.count != '' && steps.dumps.outputs.count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-wheel-crash-dumps
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ env.FZB_CRASH_DUMPS }}

      - name: Record timings
        if: always()
        shell: pwsh
        run: |
          @(
            '## windows-wheel timings',
            "- AdaptiveCpp cache: ${{ steps.toolchain.outputs.acpp-cache || 'n/a' }}",
            "- AdaptiveCpp+LLVM build seconds: $($env:acpp_build_seconds)",
            "- wheel_cp312_seconds: $($env:wheel_cp312_seconds)",
            "- wheel_cp313_seconds: $($env:wheel_cp313_seconds)",
            "- wheel_cp314_seconds: $($env:wheel_cp314_seconds)",
            "- wheel_cp315_seconds: $($env:wheel_cp315_seconds)",
            "- smoke_cp312_seconds: $($env:smoke_cp312_seconds)",
            "- smoke_cp313_seconds: $($env:smoke_cp313_seconds)",
            "- smoke_cp314_seconds: $($env:smoke_cp314_seconds)",
            "- smoke_cp315_seconds: $($env:smoke_cp315_seconds)"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (Get-Command sccache -ErrorAction SilentlyContinue) { sccache --show-stats }
          Get-PSDrive -PSProvider FileSystem
