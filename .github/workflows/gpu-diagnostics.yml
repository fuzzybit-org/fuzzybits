# GPU device-mapping diagnostic. Self-hosted GPU runners only (the targets
# job resolves .github/hardware.json on GitHub-hosted ubuntu; SKIP_<TARGET>=true
# drops a GPU). Triggers: push to ci/gpu-diagnostics (pre-merge) and
# workflow_dispatch. No GHCR, no secrets, no host installs. Only docker run --rm
# of this job's containers (shelly hosts the production swarm).
name: GPU diagnostics

on:
  push:
    branches: [ci/gpu-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    name: targets
    uses: ./.github/workflows/hw-targets.yml
    with:
      targets: sm70 sm86 sm75 sm120

  diagnose:
    name: diagnose-${{ matrix.target }}
    needs: targets
    if: needs.targets.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.diagnostics_optional == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Probe host and docker --gpus mapping
        run: |
          chmod +x scripts/ci/gpu-diagnose.sh
          scripts/ci/gpu-diagnose.sh

      - name: Remove this job's container if leftover
        if: always()
        run: docker rm -f "fuzzybits-gpu-diag-${GITHUB_RUN_ID}-${GITHUB_JOB}" || true
