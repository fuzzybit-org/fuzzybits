# Toolchain images: LLVM 20 + AdaptiveCpp (full) + CUDA 12.8 + ROCm 7.2 + Boost 1.89.
# Public repo. Self-hosted fuzzybits-ci runners; never pull_request.
# The package is public; org.opencontainers.image.source links it to this repo.
#
# Tags: `<ACPP_REF>-{generic,cuda12.8}-<TOOLCHAIN_SHA>` are content-addressed
# (scripts/ci/toolchain-sha.sh) and published from develop and ci/** alike, so
# a ci/** branch that changes the toolchain can build its own runtime images.
# The moving `<ACPP_REF>-{generic,cuda12.8}` tags follow develop only.
#
# images.yml defers when its immutable toolchain tag is not yet published
# (same push), so a successful build here dispatches it for the same ref.
name: Toolchain images

on:
  push:
    branches: [develop, "ci/**"]
    paths:
      - toolchain.env
      - docker/toolchain.Dockerfile
      - scripts/ci/toolchain-sha.sh
      - .github/workflows/toolchain.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and push toolchain
    runs-on: { group: fuzzybits-ci, labels: [self-hosted, Linux, X64] }
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/fuzzybit-org/fuzzybits-toolchain
    steps:
      - name: Isolate Docker credentials (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "${RUNNER_TEMP}/docker-config"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-config" >> "${GITHUB_ENV}"

      - name: Reclaim workspace (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          # Containers still mounting this workspace are left over from an earlier job.
          docker ps -aq --filter "volume=${GITHUB_WORKSPACE}" | xargs -r docker rm -f
          docker run --rm -v "${GITHUB_WORKSPACE}:/w" -v "${RUNNER_TOOL_CACHE}:/t" alpine:3.20 chown -R "$(id -u):$(id -g)" /w /t

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # ubuntu-24.04 starts with ~20–30 GB free. nvidia/cuda:12.8.1-devel is
      # ~8 GB uncompressed plus LLVM/AdaptiveCpp/Boost layers; the buildfs
      # needs headroom. Drop hosted-image components this job does not use.
      - name: Free disk
        if: runner.environment == 'github-hosted'
        run: |
          set -eux
          echo "== disk before =="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/node \
            /usr/lib/jvm \
            /usr/local/.ghcup \
            /opt/microsoft \
            /usr/share/miniconda || true
          sudo docker system prune -af || true
          echo "== disk after =="
          df -h /

      - name: Load pins from toolchain.env
        run: |
          set -eu
          set -a
          # shellcheck disable=SC1091
          . ./toolchain.env
          set +a
          sha="$(scripts/ci/toolchain-sha.sh)"
          {
            echo "ACPP_REF=${ACPP_REF}"
            echo "ACPP_REPO=${ACPP_REPO}"
            echo "ACPP_COMMIT=${ACPP_COMMIT}"
            echo "CLANG_VERSION=${CLANG_VERSION}"
            echo "CUDA_DEVEL_IMAGE=${CUDA_DEVEL_IMAGE}"
            echo "ROCM_VERSION=${ROCM_VERSION}"
            echo "ACPP_COMPILER_FEATURE_PROFILE=${ACPP_COMPILER_FEATURE_PROFILE}"
            echo "BOOST_VERSION=${BOOST_VERSION}"
            echo "BOOST_URL=${BOOST_URL}"
            echo "BOOST_SHA256=${BOOST_SHA256}"
            echo "TOOLCHAIN_SHA=${sha}"
          } >> "${GITHUB_ENV}"

      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          tags=(
            "${IMAGE}:${ACPP_REF}-generic-${TOOLCHAIN_SHA}"
            "${IMAGE}:${ACPP_REF}-cuda12.8-${TOOLCHAIN_SHA}"
          )
          if [[ "${GITHUB_REF}" == refs/heads/develop ]]; then
            tags+=("${IMAGE}:${ACPP_REF}-generic" "${IMAGE}:${ACPP_REF}-cuda12.8")
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          printf 'tags:\n'
          printf '  %s\n' "${tags[@]}"

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      # One image serves both cmake --preset generic and cmake --preset cuda-sm70
      # (AdaptiveCpp full = SSCP + clang CUDA SMCP + HIP). Published under both
      # variant tags; cache is buildcache-generic (cuda12.8 is an alias).
      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/toolchain.Dockerfile
          target: toolchain
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ACPP_REF=${{ env.ACPP_REF }}
            ACPP_REPO=${{ env.ACPP_REPO }}
            ACPP_COMMIT=${{ env.ACPP_COMMIT }}
            CLANG_VERSION=${{ env.CLANG_VERSION }}
            CUDA_DEVEL_IMAGE=${{ env.CUDA_DEVEL_IMAGE }}
            ROCM_VERSION=${{ env.ROCM_VERSION }}
            ACPP_COMPILER_FEATURE_PROFILE=${{ env.ACPP_COMPILER_FEATURE_PROFILE }}
            BOOST_VERSION=${{ env.BOOST_VERSION }}
            BOOST_URL=${{ env.BOOST_URL }}
            BOOST_SHA256=${{ env.BOOST_SHA256 }}
            FUZZYBITS_REVISION=${{ github.sha }}
            TOOLCHAIN_SHA=${{ env.TOOLCHAIN_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/fuzzybit-org/fuzzybits
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.ACPP_REF }}
            org.opencontainers.image.title=fuzzybits-toolchain
            org.opencontainers.image.description=LLVM ${{ env.CLANG_VERSION }} + AdaptiveCpp ${{ env.ACPP_REF }} (full SSCP + CUDA SMCP + HIP, ROCm ${{ env.ROCM_VERSION }}) for cmake --preset generic|cuda-sm70
            dev.fuzzybits.acpp.commit=${{ env.ACPP_COMMIT }}
            dev.fuzzybits.toolchain.sha=${{ env.TOOLCHAIN_SHA }}
            dev.fuzzybits.acpp.profile=${{ env.ACPP_COMPILER_FEATURE_PROFILE }}
            dev.fuzzybits.rocm.version=${{ env.ROCM_VERSION }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-generic
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-generic,mode=max

      # GITHUB_TOKEN-created workflow_dispatch events do start workflows.
      - name: Dispatch runtime images
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run images.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}"
